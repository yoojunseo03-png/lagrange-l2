<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sun–EMB L2</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#04060c">
</head>
<body>
<canvas id="scene" aria-label="3D"></canvas>
<div id="labels"></div>
<header id="top">
  <h1 data-meta data-i18n="app.title"></h1>
  <p class="sub" data-meta data-i18n="app.subtitle"></p>
  <button id="lang" type="button" data-lang-switch data-i18n="lang.switch" data-i18n-title="lang.switch_title"></button>
</header>
<section id="panel" aria-labelledby="panel-h">
  <h2 id="panel-h" data-i18n="panel.samples"></h2>
  <p class="note" data-i18n="panel.samples_note"></p>
  <div id="samples"></div>
</section>
<div id="source" role="dialog" aria-modal="false" hidden>
  <h2></h2>
  <table><tbody></tbody></table>
  <button type="button" class="close"></button>
</div>
<button id="update" type="button" hidden data-i18n="pwa.update"></button>
<div id="error" role="alert" hidden></div>
<div id="ephem-busy" class="ephem-busy" data-meta role="status" hidden data-i18n="time.loading"></div>
<footer id="version" data-meta data-i18n-title="version.title"></footer>
<div id="credits" class="credits" data-meta hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
